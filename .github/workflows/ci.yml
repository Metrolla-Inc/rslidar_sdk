name: ci

# Three tiers, separately named (TESTING.md): unit, regression, smoke.
# Nothing here pushes an image or uses a repository secret. The smoke job may log in to ghcr.io
# with this run's own read-only GITHUB_TOKEN, only to pull the released v1.5.18 image for the
# legacy comparison; when that is not allowed it says so and checks legacy mode on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest==9.0.1 pyyaml==6.0.3 shellcheck-py==0.11.0.1

      - name: Env contract, legacy entrypoint, smoke packets against rs_driver (pytest)
        run: python -m pytest tests/unit tests/legacy -v

      - name: shellcheck (new scripts; ros_entrypoint.sh's legacy part is kept byte-identical to v1.5.18)
        run: shellcheck docker/contract-entrypoint.sh docker/smoke/smoke.sh

      - name: hadolint
        # DL3008/DL3009/DL3015/DL3003/SC1091 are in the Dockerfile's v1.5.18 lines (unpinned apt
        # packages, recommends, sourcing setup.sh), kept as they are so the legacy image is built the
        # same way.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --ignore DL3008 --ignore DL3009 --ignore DL3015 --ignore DL3003 --ignore SC1091 Dockerfile

  regression:
    name: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0  # the past-bug tests read the released v1.5.18 files (2205e8b)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest==9.0.1 pyyaml==6.0.3

      - name: rs_driver 1.5.18 (the goldens' source) next to the submodule's 1.5.20
        run: |
          git -C src/rs_driver fetch --quiet --depth=1 origin cd358851ab65bf57fc7e321837be2a425305b298
          mkdir -p "$RUNNER_TEMP/rs_driver-1.5.18"
          git -C src/rs_driver archive cd358851ab65bf57fc7e321837be2a425305b298 | tar -x -C "$RUNNER_TEMP/rs_driver-1.5.18"
          echo "RS_DRIVER_OLD=$RUNNER_TEMP/rs_driver-1.5.18" >> "$GITHUB_ENV"

      - name: Goldens (legacy entrypoint, contract renders and refusals, decoding of every model) and past bugs
        run: python -m pytest tests/regression tests/legacy -v

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image (amd64, loaded locally, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: rslidar_drivers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the released image for the legacy comparison (optional)
        id: old
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          old=ghcr.io/metrolla-inc/rslidar_drivers:v1.5.18
          if echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 \
             && docker pull --platform linux/amd64 "$old" >/dev/null 2>&1; then
            echo "image=$old" >> "$GITHUB_OUTPUT"
            echo "Legacy mode compared with $old ($(docker image inspect -f '{{index .RepoDigests 0}}' "$old"))." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="Could not pull $old with this run's token; legacy mode is checked on its own (tests/legacy goldens from the v1.5.18 entrypoint, and the image's command against the fake sensor)."
            echo "::notice title=released image not readable::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Smoke (legacy mode and contract against a fake sensor sending synthetic packets)
        env:
          OLD_IMAGE: ${{ steps.old.outputs.image }}
        run: docker/smoke/smoke.sh rslidar_drivers:ci "$OLD_IMAGE"
